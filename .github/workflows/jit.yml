name: JIT targets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/lumen/**'
      - '.github/workflows/jit.yml'
  pull_request:
    paths:
      - 'crates/lumen/**'
      - '.github/workflows/jit.yml'

permissions:
  contents: read

# Release runner capacity as soon as a newer commit supersedes a run.
concurrency:
  group: jit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      # x64 benefits from faster runtime helpers; ARM tests are already quick,
      # so avoid the larger cold-build cost of optimizing the ARM JIT backend.
      CARGO_PROFILE_TEST_OPT_LEVEL: ${{ (matrix.os == 'ubuntu-24.04-arm' || matrix.os == 'macos-latest') && '0' || '1' }}
      # Split code generation into smaller units without cross-unit LTO work.
      CARGO_PROFILE_TEST_CODEGEN_UNITS: '256'
      CARGO_PROFILE_TEST_LTO: 'off'
      # Retain backtraces without storing full variable/type debug information.
      CARGO_PROFILE_TEST_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      # Wait for MSVC hashes instead of letting the first executables bypass caching.
      KACHE_NATIVE_RUNTIME_WARMUP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust compilations
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: '2.1.1'
          # Save a fresh snapshot per commit; the action's built-in key only tracks Cargo.lock.
          github-cache: false
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          max-size: '2GiB'
          pr-comment: false
      - name: Restore and save compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.KACHE_CACHE_DIR }}
          key: kache-jit-v2.1.1-opt${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-debug1-cgu256-ltooff${{ runner.os == 'Windows' && '-msvc-sync' || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            kache-jit-v2.1.1-opt${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-debug1-cgu256-ltooff${{ runner.os == 'Windows' && '-msvc-sync' || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
            kache-jit-v2.1.1-opt${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-debug1-cgu256-ltooff${{ runner.os == 'Windows' && '-msvc-sync' || '' }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Download V8 benchmark test fixtures
        shell: bash
        env:
          V8_BENCHMARK_REV: 0e2160885d0ca693577d54f1bbbe572f052282c6
        run: |
          mkdir -p v8-v7
          for fixture in base.js richards.js; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/mozilla/arewefastyet/${V8_BENCHMARK_REV}/benchmarks/v8-v7/${fixture}" \
              --output "v8-v7/${fixture}"
          done
      - name: Compile tests
        run: cargo test -p lumen --no-run
      - name: Run tests
        run: cargo test -p lumen

  # Intel macOS runners are slow to compile on, so build the x86_64 test archive on Apple Silicon
  # and spend the Intel runners only on running tests.
  build-intel:
    runs-on: macos-latest
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_CODEGEN_UNITS: '256'
      CARGO_PROFILE_TEST_LTO: 'off'
      CARGO_PROFILE_TEST_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Download V8 benchmark test fixtures
        shell: bash
        env:
          V8_BENCHMARK_REV: 0e2160885d0ca693577d54f1bbbe572f052282c6
        run: |
          mkdir -p v8-v7
          for fixture in base.js richards.js; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/mozilla/arewefastyet/${V8_BENCHMARK_REV}/benchmarks/v8-v7/${fixture}" \
              --output "v8-v7/${fixture}"
          done
      - name: Build x86_64 test archive
        run: cargo nextest archive -p lumen --target x86_64-apple-darwin --archive-file lumen-x86_64-apple-darwin.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-x86_64-apple-darwin
          path: lumen-x86_64-apple-darwin.tar.zst
          retention-days: 1

  test-intel:
    needs: build-intel
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: actions/download-artifact@v4
        with:
          name: lumen-x86_64-apple-darwin
      - name: Run tests (shard ${{ matrix.shard }}/3)
        run: >-
          cargo-nextest nextest run
          --archive-file lumen-x86_64-apple-darwin.tar.zst
          --workspace-remap .
          --partition count:${{ matrix.shard }}/3
          --no-fail-fast
