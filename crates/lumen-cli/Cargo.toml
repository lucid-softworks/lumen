# The node/deno-style entrypoint: dispatches repl / run-file / -e eval over the assembled
# runtime. The binary is `lumen-cli` for now — the engine's own `lumen` bin (the test262 host
# that test262.fyi runs) keeps its name until renaming is coordinated.
[package]
name = "lumen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Optional Linux release allocator. Default builds keep the std-only allocator.
mimalloc = ["dep:mimalloc"]

[dependencies]
lumen-host = { path = "../lumen-host" }
lumen-repl = { path = "../lumen-repl" }
lumen-runtime = { path = "../lumen-runtime" }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "=0.1.52", default-features = false, optional = true }

[lints]
workspace = true
